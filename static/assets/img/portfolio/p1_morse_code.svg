<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- morse dots and dashes for "SOS" -->
  <g fill="#6c5ce7">
    <circle cx="140" cy="180" r="8"/><circle cx="165" cy="180" r="8"/><circle cx="190" cy="180" r="8"/>
    <rect x="220" y="172" width="30" height="16" rx="8"/>
    <rect x="260" y="172" width="30" height="16" rx="8"/>
    <rect x="300" y="172" width="30" height="16" rx="8"/>
    <circle cx="345" cy="180" r="8"/><circle cx="370" cy="180" r="8"/><circle cx="395" cy="180" r="8"/>
  </g>
  <text x="300" y="230" text-anchor="middle" fill="#8890a0" font-family="monospace" font-size="14">S O S</text>
  <!-- radio wave lines -->
  <g fill="none" stroke="#c3c9d4" stroke-width="2" opacity="0.5">
    <path d="M100 120 Q120 100 140 120 T180 120 T220 120"/>
    <path d="M380 120 Q400 100 420 120 T460 120 T500 120"/>
  </g>
  <text x="300" y="340" text-anchor="middle" fill="#8890a0" font-family="monospace" font-size="16">MORSE CODE TRANSLATOR</text>
