<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg12)"/>
  <!-- ground -->
  <line x1="60" y1="290" x2="540" y2="290" stroke="#2a2f3a" stroke-width="3" stroke-dasharray="14 10"/>
  <!-- dino silhouette jumping -->
  <g fill="#6c5ce7">
    <rect x="180" y="200" width="20" height="20"/>
    <rect x="200" y="200" width="20" height="20"/>
    <rect x="200" y="180" width="20" height="20"/>
    <rect x="180" y="220" width="60" height="20"/>
    <rect x="240" y="220" width="20" height="20"/>
    <rect x="180" y="240" width="20" height="30"/>
    <rect x="220" y="240" width="20" height="20"/>
    <rect x="220" y="260" width="20" height="16"/>
  </g>
  <!-- cactus obstacle -->
  <g fill="#2ecc71">
    <rect x="380" y="230" width="14" height="60"/>
    <rect x="360" y="245" width="14" height="30"/>
    <rect x="400" y="240" width="14" height="35"/>
  </g>
  <!-- robot cursor / automation icon above dino -->
  <g transform="translate(190,110)">
    <rect x="0" y="0" width="40" height="30" rx="6" fill="#20242e" stroke="#c3c9d4" stroke-width="2"/>
    <circle cx="12" cy="15" r="4" fill="#c3c9d4"/>
    <circle cx="28" cy="15" r="4" fill="#c3c9d4"/>
    <rect x="16" y="-10" width="8" height="10" fill="#c3c9d4"/>
    <line x1="20" y1="30" x2="20" y2="55" stroke="#c3c9d4" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#8890a0" font-family="monospace" font-size="16">DINOSAUR GAME AUTOMATION</text>
</svg>
