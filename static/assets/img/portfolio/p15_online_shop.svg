    <circle cx="35" cy="55" r="7" fill="#c3c9d4"/>
    <circle cx="72" cy="55" r="7" fill="#c3c9d4"/>
  </g>
  <text x="300" y="360" text-anchor="middle" fill="#8890a0" font-family="monospace" font-size="16">LEDGER &amp; CO. — ONLINE SHOP</text>
</svg>
