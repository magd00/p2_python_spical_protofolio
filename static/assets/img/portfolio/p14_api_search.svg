  </g>
  <polygon points="150,100 450,100 300,60" fill="#6c5ce7"/>
  <!-- framed painting -->
  <rect x="255" y="150" width="90" height="70" fill="#0f1115" stroke="#f2c94c" stroke-width="4"/>
  <path d="M260 210 L290 175 L310 195 L340 160" fill="none" stroke="#6c5ce7" stroke-width="3"/>
  <!-- magnifying glass -->
  <circle cx="440" cy="270" r="34" fill="none" stroke="#c3c9d4" stroke-width="8"/>
  <line x1="465" y1="295" x2="500" y2="330" stroke="#c3c9d4" stroke-width="10" stroke-linecap="round"/>
