  </defs>
  <rect width="600" height="400" fill="url(#bg14)"/>
  <!-- museum columns -->
  <g fill="#20242e" stroke="#2a2f3a" stroke-width="2">
    <rect x="150" y="120" width="300" height="150"/>
    <rect x="160" y="100" width="20" height="180"/>
    <rect x="210" y="100" width="20" height="180"/>
    <rect x="260" y="100" width="20" height="180"/>
    <rect x="320" y="100" width="20" height="180"/>
    <rect x="370" y="100" width="20" height="180"/>
